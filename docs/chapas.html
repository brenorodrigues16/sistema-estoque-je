<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    const temaSalvo = localStorage.getItem('tema') || 'claro';
    document.documentElement.setAttribute('data-theme', temaSalvo);
    </script>

    <script>
        if (localStorage.getItem('logado') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelões Estoque - Controle de Chapas</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-th-large"></i> Dashboard</li>
                    <li class="menu-item active" onclick="window.location.href='chapas.html'"><i class="fas fa-layer-group"></i> Chapas</li>
                    <li class="menu-item" onclick="window.location.href='caixas.html'"><i class="fas fa-boxes"></i> Caixas Prontas</li>
                    <li class="menu-item" onclick="window.location.href='producao.html'"><i class="fas fa-industry"></i> Produção</li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'"><i class="fas fa-exchange-alt"></i> Movimentações</li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'"><i class="fas fa-user"></i> Perfil</li>
                    <li class="menu-item" onclick="window.location.href='expedicao.html'"><i class="fas fa-clipboard-list"></i> Expedição</li>
                    <li class="menu-item" onclick="window.location.href='entrada_chapas.html'"><i class="fas fa-truck-loading"></i> Entrada de Chapas</li>
                </ul>
            </nav>
            
            <div class="sidebar-footer">
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 0 20px;">
                <div class="user-info">
                    <div class="avatar">U</div>
                    <div>
                        <p class="username">Usuário</p>
                        <p class="role">Administrador</p>
                    </div>
                </div>
                <div class="logout-container">
                    <button onclick="fazerLogout()" class="btn-logout-red">
                        <i class="fas fa-sign-out-alt"></i> SAIR DO SISTEMA
                    </button>
                </div>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <strong><span>ESTOQUE - CHAPAS</span></strong>
                <strong><span class="date-now" id="data-atual"></span></strong> 
            </header>

            <div class="filtros-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px;">
                <div class="busca-container" style="position: relative; flex-grow: 1; max-width: 400px;">
                    <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
                    <input type="text" id="input-busca" placeholder="Buscar chapa por onda ou fornecedor..." style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 8px; border: 1px solid #ddd;">
                </div>
                <button class="btn-add" style="background-color: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-plus"></i> Nova Chapa
                </button>
            </div>

            <div class="tabela-container">
                <h4 style="margin-bottom: 15px; color: var(--sidebar-color); display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-table"></i> LISTA DE MATERIAIS</h4>
                <table id="table-container">
                    <thead>
                        <tr>
                            <th>ONDA / FORNECEDOR</th>
                            <th>COMPRIMENTO</th>
                            <th>LARGURA</th>
                            <th>QUANTIDADE</th>
                            <th style="text-align: center;">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-chapas"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="util.js"></script>
    <script>
        const API_BASE = '/api';
        const usuarioLogado = localStorage.getItem('usuario') || 'Sistema';

        async function carregarChapas() {
            try {
                const resp = await fetch(`${API_BASE}/chapas`);
                if (!resp.ok) throw new Error('Erro ao buscar chapas');
                const chapas = await resp.json();
                const tabelaCorpo = document.getElementById('tabela-chapas');
                
                tabelaCorpo.innerHTML = '';

                chapas.forEach(chapa => {
                    const comp = chapa.comprimento ?? 0;
                    const larg = chapa.largura ?? 0;
                    const fornecedor = chapa.fornecedor || 'Não informado';
                    const estoqueBaixo = chapa.quantidade <= 100;
                    const classeQtd = estoqueBaixo ? 'qtd-baixa' : 'qtd-ok';

                    const linha = `
                        <tr>
                            <td>
                                <strong>${chapa.onda}</strong><br>
                                <small style="color: #888;"><i class="fas fa-truck-moving"></i> ${fornecedor}</small>
                            </td>
                            <td>${comp} mm</td>
                            <td>${larg} mm</td>
                            <td><span class="badge-qtd ${classeQtd}">${chapa.quantidade} un</span></td>
                            <td style="text-align: center;">
                                <button class="btn-edit-icon" onclick="abrirAjuste('${chapa.onda}', ${chapa.quantidade}, ${chapa.id}, ${comp}, ${larg}, '${fornecedor}')">
                                    <i class="fas fa-edit"></i> 
                                </button>
                            </td>
                        </tr>`;
                    tabelaCorpo.innerHTML += linha;
                });
            } catch (erro) { tratarErro("Erro ao carregar tabela:", erro); }
        }

        function filtrarTabela() {
            const textoBusca = document.getElementById('input-busca').value.toLowerCase();
            const linhas = document.querySelectorAll('#tabela-chapas tr');
            linhas.forEach(linha => {
                const textoLinha = linha.innerText.toLowerCase();
                linha.style.display = textoLinha.includes(textoBusca) ? "" : "none";
            });
        }

        async function abrirAjuste(onda, qtdAtual, id, compAtual, largAtual, fornecedorAtual) {
            try {
                const respF = await fetch(`${API_BASE}/fornecedores`);
                const fornecedores = await respF.json();
                let opcoesHtml = fornecedores.map(f => `<option value="${f.nome}" ${f.nome === fornecedorAtual ? 'selected' : ''}>${f.nome}</option>`).join('');

                const { value: formValues } = await Swal.fire({
                    title: `Ajustar Chapa`,
                    html: `
                        <div class="swal-container-custom" style="display: flex; flex-direction: column; text-align: left;">
                            <label class="swal-label">Tipo de Onda:</label>
                            <input id="edit-onda-input" class="swal2-input" value="${onda.toUpperCase()}" oninput="this.value = this.value.toUpperCase()">
                            <label class="swal-label">Quantidade em Estoque:</label>
                            <input id="edit-qtd" class="swal2-input" type="number" value="${qtdAtual}">
                            <label class="swal-label">Comprimento (mm):</label>
                            <input id="edit-comp" class="swal2-input" type="number" value="${compAtual}">
                            <label class="swal-label">Largura (mm):</label>
                            <input id="edit-larg" class="swal2-input" type="number" value="${largAtual}">
                            <label class="swal-label">Fornecedor:</label>
                            <select id="edit-forn" class="swal2-input">${opcoesHtml}</select>
                        </div>`,
                    preConfirm: () => {
                        return {
                            onda: document.getElementById('edit-onda-input').value.trim().toUpperCase(),
                            novaQuantidade: Number(document.getElementById('edit-qtd').value),
                            novoComprimento: Number(document.getElementById('edit-comp').value),
                            novaLargura: Number(document.getElementById('edit-larg').value),
                            novoFornecedor: document.getElementById('edit-forn').value,
                            responsavel: usuarioLogado
                     }
                   }
                });

                if (formValues) {
                    const response = await fetch(`${API_BASE}/chapas/${id}/ajustar-estoque`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id, ...formValues })
                    });
                    if (response.ok) {
                        Swal.fire('Sucesso!', 'Dados atualizados.', 'success');
                        carregarChapas();
                    }
                }
            } catch (err) { tratarErro("Erro ao ajustar estoque:", err); }
        }

        document.querySelector('.btn-add').onclick = async () => {
            try {
                const resp = await fetch(`${API_BASE}/fornecedores`);
                const fornecedores = await resp.json();
                let opcoesHtml = fornecedores.map(f => `<option value="${f.nome}">${f.nome}</option>`).join('');

                const { value: formValues } = await Swal.fire({
                    title: 'Nova Entrada de Chapa',
                    html: `
                        <input id="swal-onda" class="swal2-input" placeholder="Onda (ex: B, BC, C)">
                        <select id="swal-forn" class="swal2-input"><option value="" disabled selected>Escolha o Fornecedor</option>${opcoesHtml}</select>
                        <input id="swal-comp" class="swal2-input" type="number" placeholder="Comprimento (mm)">
                        <input id="swal-larg" class="swal2-input" type="number" placeholder="Largura (mm)">
                        <input id="swal-qtd" class="swal2-input" type="number" placeholder="Quantidade inicial">`,
                    preConfirm: () => {
                        return {
                            onda: document.getElementById('swal-onda').value.toUpperCase(),
                            fornecedor: document.getElementById('swal-forn').value,
                            comprimento: Number(document.getElementById('swal-comp').value),
                            largura: Number(document.getElementById('swal-larg').value),
                            quantidade: Number(document.getElementById('swal-qtd').value),
                            responsavel: usuarioLogado
                        };
                    }
                });

                if (formValues) {
                    const response = await fetch(`${API_BASE}/chapas`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formValues)
                    });
                    if (response.ok) {
                        Swal.fire('Cadastrado!', 'Nova chapa no estoque.', 'success');
                        carregarChapas();
                    }
                }
            } catch (err) { tratarErro("Erro ao cadastrar chapa:", err); }
        };

        function fazerLogout() {
            Swal.fire({
                title: 'Deseja sair?',
                text: "Sua sessão será encerrada.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, sair!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear(); 
                    window.location.href = 'login.html'; 
                }
            });
        }

        window.onload = async () => {
            await carregarChapas(); 
            const elData = document.getElementById('data-atual');
            if (elData) elData.innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('input-busca').addEventListener('input', filtrarTabela);
            
            const user = localStorage.getItem('usuario');
            const cargo = localStorage.getItem('cargo');
            if (user) {
                document.querySelector('.username').innerText = user;
                document.querySelector('.avatar').innerText = user.charAt(0).toUpperCase();
            }
            if (cargo) document.querySelector('.role').innerText = cargo;
        };
    </script>
</body>
</html>
