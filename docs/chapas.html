<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Chapas - J&E Embalagens</title>
    <link rel="stylesheet" href="../dashboard.css">
</head>
<body>
    <!-- Estrutura do menu igual ao anterior -->
    <script>
        async function carregarChapas() {
            try {
                // Buscando do Render
                const response = await fetch('https://sistema-estoque-je.onrender.com/dados');
                const data = await response.json();
                const tabela = document.getElementById('tabelaChapas');
                tabela.innerHTML = data.chapas.map(chapa => `
                    <tr>
                        <td>${chapa.tipo}</td>
                        <td>${chapa.qtd} UN</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar dados do Render');
            }
        }
        carregarChapas();
    </script>
</body>
</html>
