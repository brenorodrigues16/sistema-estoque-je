<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelões Estoque - Controle de Chapas</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item" onclick="window.location.href='index.html'">
                        <i class="fas fa-th-large"></i> Dashboard
                    </li>
                    <li class="menu-item active" onclick="window.location.href='chapas.html'">
                        <i class="fas fa-layer-group"></i> Chapas
                    </li>
                    <li class="menu-item" onclick="window.location.href='caixas.html'">
                        <i class="fas fa-boxes"></i> Caixas Prontas
                    </li>
                    <li class="menu-item" onclick="window.location.href='producao.html'">
                        <i class="fas fa-industry"></i> Produção
                    </li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'">
                        <i class="fas fa-user"></i> Perfil
                    </li>
                </ul>
            </nav>
            <div class="user-info">
                <div class="avatar">U</div>
                <div>
                    <p class="username">Usuário</p>
                    <p class="role">Administrador</p>
                </div>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <span>ESTOQUE DE CHAPAS</span>
                <span class="date-now" id="data-atual"></span> 
            </header>

            <section class="filters">
                <input type="text" placeholder="Buscar tipo de chapa..." style="flex: 2;">
                <select>
                    <option>Todas as Ondas</option>
                    <option>Onda Simples</option>
                    <option>Onda Dupla</option>
                </select>
                <button class="btn-add" style="background-color: var(--accent-green); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-plus"></i> Nova Chapa
                </button>
            </section>

            <div class="table-container">
                <h4 style="margin-bottom: 15px; color: var(--sidebar-color);">ESTOQUE DE CHAPAS</h4>
                <table>
                    <thead>
                        <tr>
                            <th>TIPO DE CHAPA / FORNECEDOR</th>
                            <th>COMPRIMENTO</th>
                            <th>LARGURA</th>
                            <th>QUANTIDADE</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-chapas">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
    async function carregarChapas() {
        try {
            const resp = await fetch('[https://daybreak-huff-unaired.ngrok-free.dev](https://daybreak-huff-unaired.ngrok-free.dev)/chapas-detalhes');
            if (!resp.ok) throw new Error('Erro ao buscar chapas');
            const chapas = await resp.json();
            const tabelaCorpo = document.getElementById('tabela-chapas');
            
            tabelaCorpo.innerHTML = '';

            chapas.forEach(chapa => {
                const comp = chapa.comprimento ?? 0;
                const larg = chapa.largura ?? 0;
                const fornecedor = chapa.fornecedor || 'Não informado';
                
                const estoqueZerado = chapa.quantidade <= 0;
                const corTexto = estoqueZerado ? 'color: #e74c3c;' : '';

                const linha = `
                    <tr style="${estoqueZerado ? 'background-color: #fff5f5;' : ''}">
                        <td style="${corTexto}">
                            <strong>${chapa.onda}</strong><br>
                            <small style="color: #666; font-style: italic;">${fornecedor}</small>
                        </td>
                        <td>${comp} mm</td>
                        <td>${larg} mm</td>
                        <td style="${corTexto}"><strong>${chapa.quantidade}</strong> un</td>
                        <td class="actions">
                            <button onclick="abrirAjuste('${chapa.onda}', ${chapa.quantidade}, ${chapa.id}, ${comp}, ${larg}, '${fornecedor}')" 
                                    style="background:#27ae60; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">
                                Editar
                            </button>
                        </td>
                    </tr>`;
                tabelaCorpo.innerHTML += linha;
            });
        } catch (erro) {
            console.error("Erro ao carregar tabela:", erro);
        }
    }

    async function abrirAjuste(onda, qtdAtual, id, compAtual, largAtual, fornecedorAtual) {
        const respF = await fetch('[https://daybreak-huff-unaired.ngrok-free.dev](https://daybreak-huff-unaired.ngrok-free.dev)/fornecedores');
        const fornecedores = await respF.json();
        let opcoesHtml = fornecedores.map(f => 
            `<option value="${f.nome}" ${f.nome === fornecedorAtual ? 'selected' : ''}>${f.nome}</option>`
        ).join('');

        const { value: formValues } = await Swal.fire({
            title: `Editar Chapa: ${onda}`,
            html:
                `<label style="display:block;margin-top:10px;text-align:left;margin-left:10%">Quantidade</label><input id="swal-input1" class="swal2-input" type="number" value="${qtdAtual}">` +
                `<label style="display:block;margin-top:10px;text-align:left;margin-left:10%">Comprimento (mm)</label><input id="swal-input2" class="swal2-input" type="number" value="${compAtual}">` +
                `<label style="display:block;margin-top:10px;text-align:left;margin-left:10%">Largura (mm)</label><input id="swal-input3" class="swal2-input" type="number" value="${largAtual}">` +
                `<label style="display:block;margin-top:10px;text-align:left;margin-left:10%">Fornecedor</label>` +
                `<select id="swal-input4" class="swal2-input" style="width: 78%; display: block; margin: 10px auto;">${opcoesHtml}</select>`,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'Salvar',
            cancelButtonText: 'Cancelar',
            preConfirm: () => {
                return {
                    novaQuantidade: Number(document.getElementById('swal-input1').value),
                    novoComprimento: Number(document.getElementById('swal-input2').value),
                    novaLargura: Number(document.getElementById('swal-input3').value),
                    novoFornecedor: document.getElementById('swal-input4').value
                }
            }
        });

        if (formValues) {
            await fetch('[https://daybreak-huff-unaired.ngrok-free.dev](https://daybreak-huff-unaired.ngrok-free.dev)/ajustar-estoque', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, ...formValues })
            });
            carregarChapas();
        }
    }

    document.querySelector('.btn-add').onclick = async () => {
        const resp = await fetch('[https://daybreak-huff-unaired.ngrok-free.dev](https://daybreak-huff-unaired.ngrok-free.dev)/fornecedores');
        const fornecedores = await resp.json();
        let opcoesHtml = fornecedores.map(f => `<option value="${f.nome}">${f.nome}</option>`).join('');

        const { value: formValues } = await Swal.fire({
            title: 'Nova Chapa',
            html:
                '<input id="swal-onda" class="swal2-input" placeholder="Onda (A, B, BC...)">' +
                '<select id="swal-forn" class="swal2-input" style="width: 78%; display: block; margin: 10px auto;">' +
                    '<option value="" disabled selected>Selecione o Fornecedor</option>' +
                    opcoesHtml +
                '</select>' +
                '<input id="swal-comp" class="swal2-input" type="number" placeholder="Comprimento">' +
                '<input id="swal-larg" class="swal2-input" type="number" placeholder="Largura">' +
                '<input id="swal-qtd" class="swal2-input" type="number" placeholder="Quantidade">',
            preConfirm: () => {
                const forn = document.getElementById('swal-forn').value;
                if (!forn) { Swal.showValidationMessage('Selecione um fornecedor!'); return false; }
                return {
                    onda: document.getElementById('swal-onda').value,
                    fornecedor: forn,
                    comprimento: Number(document.getElementById('swal-comp').value),
                    largura: Number(document.getElementById('swal-larg').value),
                    quantidade: Number(document.getElementById('swal-qtd').value)
                }
            }
        });

        if (formValues) {
            await fetch('[https://daybreak-huff-unaired.ngrok-free.dev](https://daybreak-huff-unaired.ngrok-free.dev)/add-chapa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formValues)
            });
            carregarChapas();
        }
    };

    function configurarData() {
        const elementoData = document.getElementById('data-atual');
        if (elementoData) {
            const data = new Date();
            elementoData.innerText = data.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
    }

    window.onload = () => { carregarChapas(); configurarData(); };
    </script>
</body>
</html>
