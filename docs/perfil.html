<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
        // Bloqueio de segurança e aplicação imediata do tema
        const logado = localStorage.getItem('logado');
        const temaSalvo = localStorage.getItem('tema') || 'claro';
        
        if (logado !== 'true') { 
            window.location.href = 'login.html'; 
        } else {
            // Aplica o tema antes da página carregar para evitar o "flash" branco
            document.documentElement.setAttribute('data-theme', temaSalvo);
        }
    </script>
    <meta charset="UTF-8">
    <title>Configurações - J&E</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item" onclick="window.location.href='index.html'">
                        <i class="fas fa-th-large"></i> Dashboard
                    </li>
                    <li class="menu-item" onclick="window.location.href='chapas.html'">
                        <i class="fas fa-layer-group"></i> Chapas
                    </li>
                    <li class="menu-item" onclick="window.location.href='caixas.html'">
                        <i class="fas fa-boxes"></i> Caixas Prontas
                    </li>
                    <li class="menu-item" onclick="window.location.href='producao.html'">
                        <i class="fas fa-industry"></i> Produção
                    </li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </li>
                    <li class="menu-item active" onclick="window.location.href='perfil.html'">
                        <i class="fas fa-user"></i> Perfil
                    </li>
                    <li class="menu-item" onclick="window.location.href='expedicao.html'">
                        <i class="fas fa-clipboard-list"></i> Expedição
                    </li>
                    <li class="menu-item" onclick="window.location.href='entrada_chapas.html'">
                        <i class="fas fa-truck-loading"></i> Entrada de Chapas
                    </li>
                </ul>
            </nav>
                    
        <div class="sidebar-footer">
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 0 20px;">
            <div class="user-info">
            <div class="avatar">U</div>
            <div>
                <p class="username">Usuário</p>
                <p class="role">administrador</p>
            </div>
        </div>

        <div class="logout-container">
            <button onclick="fazerLogout()" class="btn-logout-red">
                <i class="fas fa-sign-out-alt"></i> SAIR DO SISTEMA
            </button>
        </div>
    </div>

        </aside>


    <main class="content">
        <header class="top-bar">
            <strong>CONFIGURAÇÕES</strong>
            <strong id="data-atual"></strong>
        </header>

        <div class="settings-container">
            <form id="form-perfil">
                <div class="settings-card">
                    <h2 class="settings-section-title"><i class="fas fa-lock"></i> Segurança</h2>
                    <div style="margin-bottom: 20px;">
                        <label class="swal-label">E-mail de Recuperação</label>
                        <input type="email" id="email" class="swal2-input-custom" style="padding:10px; border-radius:6px; border:1px solid #ddd; width:100%;">
                    </div>
                    <div class="grid-campos">
                        <div>
                            <label class="swal-label">Nova Senha</label>
                            <div class="password-wrapper">
                                <input type="password" id="senha" class="swal2-input-custom" style="padding:10px; border-radius:6px; border:1px solid #ddd; width:100%;">
                                <i class="fas fa-eye" onclick="verSenha('senha')"></i>
                            </div>
                        </div>
                        <div>
                            <label class="swal-label">Confirmar Senha</label>
                            <div class="password-wrapper">
                                <input type="password" id="confirmar-senha" class="swal2-input-custom" style="padding:10px; border-radius:6px; border:1px solid #ddd; width:100%;">
                                <i class="fas fa-eye" onclick="verSenha('confirmar-senha')"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="settings-card">
                    <h2 class="settings-section-title"><i class="fas fa-palette"></i> Aparência</h2>
                    <label class="swal-label">Tema do Sistema</label>
                    <select id="tema" class="swal2-input-custom" style="padding:10px; border-radius:6px; border:1px solid #ddd; width:100%;">
                        <option value="claro">Modo Claro</option>
                        <option value="dark">Modo Escuro</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="flex:2; background: var(--accent-green); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
                        SALVAR ALTERAÇÕES
                    </button>
                    <button type="button" onclick="window.location.href='index.html'" style="flex:1; background: var(--secondary-color); color:white; border:none; border-radius:8px; cursor:pointer;">
                        CANCELAR
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="util.js"></script>
<script>
    // Mostrar/Esconder senha
    function verSenha(id) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Carregar dados e data
    window.onload = () => {
        document.getElementById('data-atual').innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('email').value = localStorage.getItem('usuarioEmail') || '';
        document.getElementById('tema').value = localStorage.getItem('tema') || 'claro';

       const user = localStorage.getItem('usuario');
            const cargo = localStorage.getItem('cargo');
            if (user) {
                document.querySelector('.username').innerText = user;
                document.querySelector('.avatar').innerText = user.charAt(0).toUpperCase();
            }
            if (cargo) document.querySelector('.role').innerText = cargo;
        };

    // Salvar Alterações
    document.getElementById('form-perfil').addEventListener('submit', async (e) => {
        e.preventDefault();
        const temaSelecionado = document.getElementById('tema').value;

        // Validação simples de senha
        if (document.getElementById('senha').value !== document.getElementById('confirmar-senha').value) {
            return Swal.fire('Erro', 'As senhas não coincidem!', 'error');
        }

        try {
            const resp = await fetch('/api/atualizar-perfil', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id: localStorage.getItem('usuarioID'),
                    email: document.getElementById('email').value,
                    senha: document.getElementById('senha').value,
                    tema: temaSelecionado
                })
            });

            if(resp.ok) {
                // Salva localmente e aplica o tema na hora
                localStorage.setItem('tema', temaSelecionado);
                document.documentElement.setAttribute('data-theme', temaSelecionado);
                
                Swal.fire('Sucesso!', 'Configurações atualizadas!', 'success');
            }
        } catch (err) {
            tratarErro('Erro', 'Falha ao conectar com o servidor.', 'error');
        }
    });

     function fazerLogout() {
            Swal.fire({
                title: 'Deseja sair?',
                text: "Sua sessão será encerrada.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, sair!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear(); 
                    window.location.href = 'login.html'; 
                }
            });
        }

</script>
</body>
</html>
