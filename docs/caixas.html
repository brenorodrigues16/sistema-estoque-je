<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelões Estoque - Caixas Prontas</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item" onclick="window.location.href='index.html'">
                        <i class="fas fa-th-large"></i> Dashboard
                    </li>
                    <li class="menu-item" onclick="window.location.href='chapas.html'">
                        <i class="fas fa-layer-group"></i> Chapas
                    </li>
                    <li class="menu-item active" onclick="window.location.href='caixas.html'">
                        <i class="fas fa-boxes"></i> Caixas Prontas
                    </li>
                    <li class="menu-item" onclick="window.location.href='producao.html'">
                        <i class="fas fa-industry"></i> Produção
                    </li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'">
                        <i class="fas fa-user"></i> Perfil
                    </li>
                    <li class="menu-item" onclick="window.location.href='expedicao.html'">
                        <i class="fas fa-truck"></i> Expedição
                    </li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="avatar">U</div>
                <div>
                    <p class="username">Usuário</p>
                    <p class="role">Administrador</p>
                </div>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <span>ESTOQUE DE CAIXAS PRONTAS</span> 
                <span class="date-now" id="data-atual"></span> 
            </header>

            <div class="filtros-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    
    <div class="busca-container" style="position: relative; flex-grow: 1; max-width: 400px;">
        <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
        <input type="text" id="input-busca" placeholder="Buscar por cliente ou código..." style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 8px; border: 1px solid #ddd;">
    </div>

    <button onclick="novoRegistro()" class="btn-novo" style="background-color: var(--accent-green); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-plus"></i> Registrar Nova Caixa
    </button>

    </div>

            <div class="tabela-container">
                <h4 style="margin-bottom: 15px; color: var(--sidebar-color);">CONTROLE DE CAIXAS PRONTAS</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Código/Referencia</th>
                            <th>QUANTIDADE</th>
                            <th>DATA DE FABRICAÇÃO</th>
                            <th>RESPONSAVEL</th>
                            <th>EDITAR</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo-caixas">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
    // 1. Função para carregar as caixas do banco
    async function carregarCaixas() {
        try {
            const resp = await fetch('http://localhost:3000/api/caixas');
            const caixas = await resp.json();
            const tabelaCorpo = document.getElementById('tabela-corpo-caixas'); // Garanta que este ID existe no seu <tbody>
            
            tabelaCorpo.innerHTML = '';

            caixas.forEach(caixa => {
   
                const linha = `
                    <tr>
                        <td><strong>${caixa.cliente}</strong></td>
                        <td>${caixa.codigo}</td>
                        <td>${caixa.quantidade} un</td>
                        <td>${new Date(caixa.data_fabricacao).toLocaleDateString('pt-BR')}</td>
                        <td><strong>${caixa.responsavel}</strong></td>
                        <td class="actions" style="display: flex; gap: 8px;">
                            <button onclick="editarCaixa(${caixa.id}, '${caixa.cliente}', '${caixa.codigo}', ${caixa.quantidade}, '${caixa.data_fabricacao}', '${caixa.responsavel}')" 
                                 style="background:#3498db; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">
                                <i class="fas fa-edit"></i>
                            </button>
                        
                            </td>
                    </tr>`;
                tabelaCorpo.innerHTML += linha;
            });

        } catch (erro) {
            console.error("Erro ao carregar caixas:", erro);
        }
    }

    // 2. Função para o botão "Registrar Nova Caixa"
   async function novoRegistro() {
    const { value: formValues } = await Swal.fire({
        title: 'Registrar Nova Caixa',
        html:
            `<label style="display:block; text-align:left; margin-left:40px;">Cliente:</label>` +
            `<input id="swal-cliente" class="swal2-input" placeholder="Nome do cliente">` +
            `<label style="display:block; text-align:left; margin-left:40px;">Código:</label>` +
            `<input id="swal-codigo" class="swal2-input" placeholder="Código / Referência da caixa">` +
            `<label style="display:block; text-align:left; margin-left:40px;">Quantidade:</label>` +
            `<input id="swal-qtd" class="swal2-input" type="number" placeholder="Quantidade">` +
            `<label style="display:block; text-align:left; margin-left:40px;">Data de Fabricação:</label>` +
            `<input id="swal-data" class="swal2-input" type="date">` +
            `<label style="display:block; text-align:left; margin-left:40px;">Responsável:</label>` +
            `<input id="swal-responsavel" class="swal2-input" placeholder="Nome do responsável">`, // CORRIGIDO: removido o 'n' extra
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Confirmar novo Registro',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#27ae60',
        preConfirm: () => {
            // Verificação básica para não enviar campo vazio
            const cliente = document.getElementById('swal-cliente').value;
            const codigo = document.getElementById('swal-codigo').value;
            const qtd = document.getElementById('swal-qtd').value;
            const data = document.getElementById('swal-data').value;
            const resp = document.getElementById('swal-responsavel').value;

            if (!cliente || !codigo || !qtd || !data || !resp) {
                Swal.showValidationMessage('Por favor, preencha todos os campos!');
                return false;
            }

            return {
                cliente: cliente,
                codigo: codigo,
                quantidade: qtd,
                data_fabricacao: data,
                responsavel: resp
            }
        }
    });

    if (formValues) {
        try {
            const response = await fetch('http://localhost:3000/api/caixas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formValues)
            });
            
            const resData = await response.json();
            
            if (resData.success) {
                Swal.fire('Sucesso!', 'Caixa registrada com sucesso.', 'success');
                carregarCaixas(); // Atualiza a tabela na hora
            } else {
                Swal.fire('Erro!', 'Erro ao salvar no banco: ' + resData.message, 'error');
            }
        } catch (erro) {
            console.error("Erro na requisição:", erro);
            Swal.fire('Erro!', 'Não foi possível conectar ao servidor.', 'error');
        }
    }
}

    // 3. Função de Busca (igual à de chapas)
    function filtrarCaixas() {
        const textoBusca = document.getElementById('input-busca').value.toLowerCase();
        const linhas = document.querySelectorAll('#tabela-corpo-caixas tr');

        linhas.forEach(linha => {
            const conteúdo = linha.innerText.toLowerCase();
            linha.style.display = conteúdo.includes(textoBusca) ? "" : "none";
        });
    }

    async function ajustarQtd(id, mudanca) {
    try {
        await fetch('http://localhost:3000/api/caixas/ajustar-estoque', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, mudanca })
        });
        carregarCaixas(); // Atualiza a tabela na hora
    } catch (erro) {
        console.error("Erro ao ajustar quantidade:", erro);
    }
}

async function editarCaixa(id, clienteAt, codigoAt, qtdAt, dataAt, respAt) {
    // Formata a data para o padrão do input date (AAAA-MM-DD)
    const dataFormatada = dataAt ? new Date(dataAt).toISOString().split('T')[0] : '';

    const { value: formValues } = await Swal.fire({
        title: 'Ajustar Registro de Caixa',
        html: `
            <label style="display:block; text-align:left; margin-left:40px;">Cliente:</label>
            <input id="edit-cliente" class="swal2-input" value="${clienteAt}">
            <label style="display:block; text-align:left; margin-left:40px;">Código:</label>
            <input id="edit-codigo" class="swal2-input" value="${codigoAt}">
            <label style="display:block; text-align:left; margin-left:40px;">Quantidade:</label>
            <input id="edit-qtd" class="swal2-input" type="number" value="${qtdAt}">
            <label style="display:block; text-align:left; margin-left:40px;">Data de Fabricação:</label>
            <input id="edit-data" class="swal2-input" type="date" value="${dataFormatada}">
            <label style="display:block; text-align:left; margin-left:40px;">Responsável:</label>
            <input id="edit-resp" class="swal2-input" value="${respAt}">`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Salvar Alterações',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#27ae60',
        preConfirm: () => {
            return {
                id: id,
                cliente: document.getElementById('edit-cliente').value,
                codigo: document.getElementById('edit-codigo').value,
                quantidade: document.getElementById('edit-qtd').value,
                data_fabricacao: document.getElementById('edit-data').value,
                responsavel: document.getElementById('edit-resp').value
            }
        }
    });

    if (formValues) {
        try {
            const response = await fetch('http://localhost:3000/api/caixas/editar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formValues)
            });

            const result = await response.json();

            if (result.success) {
                Swal.fire({
                    icon: 'success',
                    title: 'Atualizado!',
                    text: 'Os dados foram salvos com sucesso.',
                    timer: 1500,
                    showConfirmButton: false
                });
                carregarCaixas(); // Recarrega a tabela automaticamente
            } else {
                Swal.fire('Erro', 'Erro ao salvar: ' + result.message, 'error');
            }
        } catch (erro) {
            console.error("Erro na requisição:", erro);
            Swal.fire('Erro', 'Não foi possível conectar ao servidor.', 'error');
        }
    }
}

    // 4. Inicialização
    window.onload = () => {
        carregarCaixas();
        
        // Ativa a busca em tempo real
        const inputBusca = document.getElementById('input-busca');
        if (inputBusca) {
            inputBusca.addEventListener('input', filtrarCaixas);
        }

        // Se tiver o elemento de data na top bar
        const elementoData = document.getElementById('data-atual');
        if (elementoData) {
            elementoData.innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
    };
</script>

</body>
</html>
