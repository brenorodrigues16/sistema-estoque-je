<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papelões Estoque - Caixas Prontas</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item" onclick="window.location.href='index.html'">
                        <i class="fas fa-th-large"></i> Dashboard
                    </li>
                    <li class="menu-item" onclick="window.location.href='chapas.html'">
                        <i class="fas fa-layer-group"></i> Chapas
                    </li>
                    <li class="menu-item active" onclick="window.location.href='caixas.html'">
                        <i class="fas fa-boxes"></i> Caixas Prontas
                    </li>
                    <li class="menu-item" onclick="window.location.href='producao.html'">
                        <i class="fas fa-industry"></i> Produção
                    </li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'">
                        <i class="fas fa-user"></i> Perfil
                    </li>
                    <li class="menu-item" onclick="window.location.href='expedicao.html'">
                        <i class="fas fa-truck"></i> Expedição
                    </li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="avatar">U</div>
                <div>
                    <p class="username">Usuário</p>
                    <p class="role">Administrador</p>
                </div>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <span>ESTOQUE DE CAIXAS PRONTAS</span> 
                <span class="date-now" id="data-atual"></span> 
            </header>

            <div class="filtros-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    
    <div class="busca-container" style="position: relative; flex-grow: 1; max-width: 400px;">
        <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;"></i>
        <input type="text" id="input-busca" placeholder="Buscar por cliente ou código..." style="width: 100%; padding: 12px 15px 12px 45px; border-radius: 8px; border: 1px solid #ddd;">
    </div>

    <button onclick="novoRegistro()" class="btn-novo" style="background-color: var(--accent-green); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px;">
        <i class="fas fa-plus"></i> Registrar Nova Caixa
    </button>

    </div>

            <div class="table-container">
                <h4 style="margin-bottom: 15px; color: var(--sidebar-color);">CONTROLE DE CAIXAS PRONTAS</h4>
                <table>
                    <thead>
                        <tr>
                            <th>CÓDIGO DA CAIXA</th>
                            <th>MEDIDAS</th>
                            <th>QUANTIDADE</th>
                            <th>DATA DE FABRICAÇÃO</th>
                            <th>AÇÕES / ATUALIZAR / EDITAR</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo-caixas">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
    // --- CONFIGURAÇÃO DE DATA ---
    function configurarData() {
        const elementoData = document.getElementById('data-atual');
        if (elementoData) {
            const data = new Date();
            elementoData.innerText = data.toLocaleDateString('pt-BR', { 
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' 
            });
        }
    }

    // --- CARREGAR DADOS DO SERVIDOR ---
    async function carregarTabela() {
        try {
            const resposta = await fetch('http://localhost:3000/caixas');
            if (!resposta.ok) throw new Error('Erro ao buscar dados');
            const caixas = await resposta.json();

            const corpoTabela = document.getElementById('tabela-corpo-caixas');
            corpoTabela.innerHTML = ''; 

            caixas.forEach(caixa => {
                let statusClass = caixa.quantidade <= 0 ? 'status-critico' : (caixa.quantidade < 50 ? 'status-alerta' : 'status-bom');
                let statusTexto = caixa.quantidade <= 0 ? 'ZERADO' : (caixa.quantidade < 50 ? 'BAIXO ESTOQUE' : 'ESTOQUE BOM');

                const linha = `
                    <tr>
                        <td>
                            <div style="font-weight: bold; font-size: 1.1em; color: #333;">
                                <i class="fas fa-user" style="font-size: 0.85em; color: #ffa500;"></i> ${caixa.cliente || 'Consumidor Final'}
                            </div>
                            <div style="font-size: 0.85em; color: #666; margin-top: 2px;">
                                Ref: ${caixa.codigo}
                            </div>
                        </td>
                        <td><span class="medida-tag">${caixa.medidas}</span></td>
                        <td>
                            <strong>${caixa.quantidade} un</strong>
                            <span class="status-badge ${statusClass}">${statusTexto}</span>
                        </td>
                        <td>${caixa.data_fabricacao ? new Date(caixa.data_fabricacao).toLocaleDateString('pt-BR') : '---'}</td>
                        <td class="actions">
                            <button onclick="alterarQtd(${caixa.id}, 1)" class="btn-action-small btn-plus">+</button>
                            <button onclick="alterarQtd(${caixa.id}, -1)" class="btn-action-small btn-minus">-</button>
                            <button onclick="editarCaixa(${caixa.id}, '${caixa.cliente || caixa.codigo}')" class="btn-action-small btn-edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="editarDadosCompletos(${caixa.id}, '${caixa.cliente}', '${caixa.codigo}', '${caixa.medidas}')" class="btn-action-small" style="background: #6c757d; color: white;">
                                <i class="fas fa-pen"></i>
                                    </button>
                            </button>
                        </td>
                    </tr>`;
                corpoTabela.innerHTML += linha;
            });
        } catch (error) {
            console.error("Erro ao carregar tabela:", error);
        }
    }

    // --- ALTERAR QUANTIDADE RÁPIDO (+ e -) ---
    async function alterarQtd(id, valor) {
        try {
            await fetch('http://localhost:3000/ajustar-estoque-caixa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, ajuste: valor, ehSubstituicao: false })
            });
            carregarTabela();
        } catch (error) {
            Swal.fire('Erro', 'Não foi possível atualizar o estoque', 'error');
        }
    }

    // --- BOTÃO AZUL: EDITAR VALOR TOTAL ---
    async function editarCaixa(id, nome) {
    const { value: novoValor, isDismissed } = await Swal.fire({
        title: `Ajustar estoque: ${nome}`,
        input: 'number',
        inputLabel: 'Digite a quantidade total exata no estoque',
        showCancelButton: true,
        confirmButtonText: 'Atualizar',
        cancelButtonText: 'Cancelar'
    });

    if (isDismissed) return;

    if (novoValor !== null && novoValor !== "") {
        try {
            await fetch('http://localhost:3000/ajustar-estoque-caixa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, ajuste: parseInt(novoValor), ehSubstituicao: true })
            });
            carregarTabela();
        } catch (error) {
            Swal.fire('Erro', 'Não foi possível editar.', 'error');
        }
    }
}

// --- BOTÃO DE EDIÇÃO COMPLETA (CLIENTE, CÓDIGO, MEDIDAS) ---
async function editarDadosCompletos(id, clienteAtual, codigoAtual, medidasAtual) {
    const { value: formValues } = await Swal.fire({
        title: 'Editar Informações da Caixa',
        html: `
            <input id="edit-cliente" class="swal2-input" value="${clienteAtual}" placeholder="Cliente">
            <input id="edit-codigo" class="swal2-input" value="${codigoAtual}" placeholder="Código">
            <input id="edit-medida" class="swal2-input" value="${medidasAtual}" placeholder="Medidas">
        `,
        focusConfirm: false,
        showCancelButton: true,
        preConfirm: () => {
            return {
                id: id,
                cliente: document.getElementById('edit-cliente').value,
                codigo: document.getElementById('edit-codigo').value.toUpperCase(),
                medidas: document.getElementById('edit-medida').value
            }
        }
    });

    if (formValues) {
        try {
            await fetch('http://localhost:3000/editar-dados-caixa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formValues)
            });
            carregarTabela();
            Swal.fire('Atualizado!', 'Os dados foram corrigidos.', 'success');
        } catch (error) {
            Swal.fire('Erro', 'Erro ao atualizar dados.', 'error');
        }
    }
}

    // --- BUSCA EM TEMPO REAL ---
    document.getElementById('input-busca').addEventListener('input', async (e) => {
        const termo = e.target.value.trim();

        if (termo.length === 0) { 
            carregarTabela(); 
            return; 
        }

        try {
            const resp = await fetch(`http://localhost:3000/buscar-caixas?termo=${termo}`);
            const caixas = await resp.json();
            const corpoTabela = document.getElementById('tabela-corpo-caixas');
            corpoTabela.innerHTML = ''; 

            caixas.forEach(caixa => {
                let statusClass = caixa.quantidade <= 0 ? 'status-critico' : (caixa.quantidade < 50 ? 'status-alerta' : 'status-bom');
                let statusTexto = caixa.quantidade <= 0 ? 'ZERADO' : (caixa.quantidade < 50 ? 'BAIXO ESTOQUE' : 'ESTOQUE BOM');

                const linha = `
                    <tr>
                        <td>
                            <div style="font-weight: bold; font-size: 1.1em; color: #333;">
                                <i class="fas fa-user" style="font-size: 0.85em; color: #ffa500;"></i> ${caixa.cliente || 'Consumidor Final'}
                            </div>
                            <div style="font-size: 0.85em; color: #666; margin-top: 2px;">
                                Ref: ${caixa.codigo}
                            </div>
                        </td>
                        <td><span class="medida-tag">${caixa.medidas}</span></td>
                        <td>
                            <strong>${caixa.quantidade} un</strong>
                            <span class="status-badge ${statusClass}">${statusTexto}</span>
                        </td>
                        <td>${caixa.data_fabricacao ? new Date(caixa.data_fabricacao).toLocaleDateString('pt-BR') : '---'}</td>
                        <td class="actions">
                            <button onclick="alterarQtd(${caixa.id}, 1)" class="btn-action-small btn-plus">+</button>
                            <button onclick="alterarQtd(${caixa.id}, -1)" class="btn-action-small btn-minus">-</button>
                            <button onclick="editarCaixa(${caixa.id}, '${caixa.cliente || caixa.codigo}')" class="btn-action-small btn-edit">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>`;
                corpoTabela.innerHTML += linha;
            });
        } catch (error) {
            console.error("Erro na busca:", error);
        }
    });

    // --- ADICIONAR NOVA CAIXA ---
    async function novoRegistro() {
        const { value: formValues } = await Swal.fire({
            title: 'Cadastrar Nova Caixa',
            html: `
                <div style="text-align: left; margin-bottom: 5px; font-weight: bold;">Cliente/Comprador:</div>
                <input id="swal-cliente" class="swal2-input" placeholder="Ex: Nome do Cliente">
                
                <div style="text-align: left; margin-bottom: 5px; font-weight: bold; margin-top: 15px;">Código da Caixa:</div>
                <input id="swal-codigo" class="swal2-input" value="CX - " placeholder="Ex: 001 ou NOME">
                
                <div style="text-align: left; margin-bottom: 5px; font-weight: bold; margin-top: 15px;">Medidas:</div>
                <input id="swal-medida" class="swal2-input" placeholder="Ex: 30 x 500 x ...">
                
                <div style="text-align: left; margin-bottom: 5px; font-weight: bold; margin-top: 15px;">Quantidade Inicial:</div>
                <input id="swal-qtd" class="swal2-input" type="number" value="0">
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'Salvar nova Caixa',
            preConfirm: () => {
                return {
                    cliente: document.getElementById('swal-cliente').value,
                    codigo: document.getElementById('swal-codigo').value.toUpperCase(),
                    medidas: document.getElementById('swal-medida').value,
                    quantidade: document.getElementById('swal-qtd').value
                }
            }
        });

        if (formValues) {
            try {
                const resposta = await fetch('http://localhost:3000/add-caixa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formValues)
                });
                if (resposta.ok) {
                    Swal.fire('Sucesso!', 'Nova caixa adicionada!', 'success');
                    carregarTabela();
                }
            } catch (error) {
                Swal.fire('Erro', 'Erro ao conectar ao banco.', 'error');
            }
        }
    }

    window.onload = () => {
        configurarData();
        carregarTabela();
    };
</script>

</body>
</html>
