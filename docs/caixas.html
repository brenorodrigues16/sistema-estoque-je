<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Caixas - J&E Embalagens</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">J&E Embalagens</div>
            <nav>
                <a href="index.html">Painel Principal</a>
                <a href="chapas.html">Estoque de Chapas</a>
                <a href="caixas.html" class="active">Estoque de Caixas</a>
                <a href="producao.html">Lançar Produção</a>
            </nav>
        </aside>

        <main class="content">
            <header><h1>Estoque de Caixas Prontas</h1></header>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Código/Medida</th>
                            <th>Quantidade em Estoque</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCaixas">
                        <!-- Dados carregados via API -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        async function carregarCaixas() {
            try {
                // ATUALIZADO: Buscando dados de caixas do Render
                const response = await fetch('https://sistema-estoque-je.onrender.com/dados');
                const data = await response.json();
                
                const tabela = document.getElementById('tabelaCaixas');
                tabela.innerHTML = data.caixas.map(caixa => `
                    <tr>
                        <td>${caixa.medidas}</td>
                        <td>${caixa.quantidade} UN</td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar caixas:', error);
            }
        }
        carregarCaixas();
    </script>
</body>
</html>
