    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item active" onclick="window.location.href='index.html'">
                        <i class="fas fa-th-large"></i> Dashboard
                    </li>
                    <li class="menu-item" onclick="window.location.href='chapas.html'">

                    </li>
                    <li class="menu-item" onclick="window.location.href='caixas.html'">
                        <i class="fas fa-boxes"></i> Caixas Prontas
                    </li>
                    <li class="menu-item" onclick="window.location.href='producao.html'">
                        <i class="fas fa-industry"></i> Produção
                    </li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'">
                        <i class="fas fa-user"></i> Perfil
                    </li>
                    <li class="menu-item" onclick="window.location.href='expedicao.html'">
                        <i class="fas fa-truck"></i> Expedição
                    </li>
                </ul>
            </nav>
                    
        <div class="sidebar-footer">
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 0 20px;">
            <div class="user-info">
            <div class="avatar">U</div>
            <div>
                <p class="username">Usuário</p>
                <p class="role">administrador</p>
            </div>
        </div>

        <div class="logout-container">
            <button onclick="fazerLogout()" class="btn-logout-red">
                <i class="fas fa-sign-out-alt"></i> SAIR DO SISTEMA
            </button>
        </div>
    </div>

        </aside>

        <main class="content">
            <header class="top-bar">
                <strong><span>DASHBOARD</span></strong> 
                <strong><span class="date-now" id="data-atual"></span></strong>
            </header>

            <section class="cards-grid">
                <div class="card blue">
                    <i class="fas fa-layer-group"></i>
                    <div class="card-info">
                        <h3><span id="estoque-valor">0</span></h3>
                        <p>QUANTIDADE DE CHAPAS ESTOQUE ATUAL </p>
                    </div>
                </div>
                <div class="card orange">
                    <i class="fas fa-clock"></i>
                    <div class="card-info">
                        <h3><span id="hora-atualizacao">--:--</span></h3>
                        <p>ÚLTIMA ATUALIZAÇÃO.</p>
                    </div>
                </div>
            </section>

            <section class="cards-grid">
                <div class="card blue">
                    <i class="fas fa-boxes"></i>
                    <div class="card-info">
                        <h3>Caixas em Estoque</h3>
                    </div>
                </div>
            </section>

            <section class="stats-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                <div class="chart-placeholder" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <h4 style="margin-bottom: 20px;"><i class="fas fa-chart-line"></i> Estoque atual</h4>
                    <div id="container-progresso"></div>
                </div>
                
                <div class="chart-placeholder" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <h4 style="margin-bottom: 20px;"><i class="fas fa-bell"></i> Avisos Rápidos</h4>
                    <div id="container-avisos">
                        <p style="padding: 10px 0; border-bottom: 1px solid #f0f0f0; color: #666;">Carregando avisos...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

        <script>
    function atualizarRelogio() {
        const elementoData = document.getElementById('data-atual');
        const elementoHora = document.getElementById('hora-atualizacao');
        const agora = new Date();
        const opcoesData = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        if (elementoData) elementoData.innerText = agora.toLocaleDateString('pt-BR', opcoesData);
        if (elementoHora) elementoHora.innerText = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    async function carregarDashboard() {
        try {
            const resposta = await fetch('http://localhost:3000/dados');
            const dados = await resposta.json();

            const valorEstoque = document.getElementById('estoque-valor');
            if (valorEstoque) {
                valorEstoque.innerText = `${dados.estoqueTotal.toLocaleString()} un`;
            }

            const container = document.getElementById('container-progresso');
            const containerAvisos = document.getElementById('container-avisos');
            
            container.innerHTML = '';
            containerAvisos.innerHTML = '';

            const limiteVisual = 100000;

            if (dados.chapas && dados.chapas.length > 0) {
                dados.chapas.forEach(item => {
                    const qtd = Number(item.quantidade) || 0;
                    let porcentagem = (qtd / limiteVisual) * 100;
                    if (porcentagem > 100) porcentagem = 100;

                    container.innerHTML += `
                        <div class="progress-item" style="margin-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                <strong>${item.onda}</strong>
                                <span>${qtd.toLocaleString()} un</span>
                            </div>
                            <div style="background: #eee; height: 12px; border-radius: 10px; width: 100%; overflow: hidden;">
                                <div style="background: #3498db; width: ${porcentagem}%; height: 100%; transition: width 0.8s ease-in-out;"></div>
                            </div>
                        </div>`;

                    if (qtd <= 500) {
                        containerAvisos.innerHTML += `
                            <p style="padding: 10px 0; border-bottom: 1px solid #f0f0f0; color: #e74c3c; font-weight: bold;">
                                • Estoque de ${item.onda} crítico: apenas ${qtd.toLocaleString()} un no total.
                            </p>`;
                    }
                });

                if (containerAvisos.innerHTML === '') {
                    containerAvisos.innerHTML = '<p style="color: #27ae60;">• Todas as ondas com estoque saudável.</p>';
                }
            } else {
                container.innerHTML = '<p style="color:#666;">Nenhuma chapa cadastrada.</p>';
            }

            atualizarRelogio();
        } catch (erro) {
            console.error('Erro ao carregar dashboard:', erro);
        }
    }

    // - - CONFIGURACAO DE LOGIN E LOGOUT - - //

    function fazerLogout() {
    Swal.fire({
        title: 'Deseja sair?',
        text: "Sua sessão será encerrada.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#e74c3c',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Sim, sair!',
        cancelButtonText: 'Cancelar'
    }).then((result) => {
        if (result.isConfirmed) {
            localStorage.clear(); 
            window.location.href = 'login.html'; 
        }
    });
}

    window.onload = () => {
        carregarDashboard();
        setInterval(atualizarRelogio, 60000);
        // Dica: atualizar o dashboard a cada 5 min também é bom
        setInterval(carregarDashboard, 300000); 
    };

window.addEventListener('DOMContentLoaded', () => {
    // Busca os dados salvos no momento do login
    const nomeUsuario = localStorage.getItem('usuario');
    const cargoUsuario = localStorage.getItem('cargo');

    // Seleciona os elementos pelas classes que você já tem no HTML
    const elementoNome = document.querySelector('.username');
    const elementoCargo = document.querySelector('.role');
    const elementoAvatar = document.querySelector('.avatar');

    if (nomeUsuario && elementoNome) {
        elementoNome.innerText = nomeUsuario;
    }

    if (cargoUsuario && elementoCargo) {
        elementoCargo.innerText = cargoUsuario;
    }

    // Bônus: Muda a letra do Avatar para a primeira letra do nome do usuário
    if (nomeUsuario && elementoAvatar) {
        elementoAvatar.innerText = nomeUsuario.charAt(0).toUpperCase();
    }
});

    
</script>
    
</body>
</html>
