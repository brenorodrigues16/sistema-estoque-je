<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Estoque - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    
    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item active" onclick="window.location.href='index.html'">
                        <i class="fas fa-th-large"></i> Dashboard
                    </li>
                    <li class="menu-item" onclick="window.location.href='chapas.html'">
                        <i class="fas fa-layer-group"></i> Chapas
                    </li>
                    <li class="menu-item" onclick="window.location.href='caixas.html'">
                        <i class="fas fa-boxes"></i> Caixas Prontas
                    </li>
                    <li class="menu-item" onclick="window.location.href='producao.html'">
                        <i class="fas fa-industry"></i> Produção
                    </li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'">
                        <i class="fas fa-user"></i> Perfil
                    </li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="avatar">U</div>
                <div>
                    <p class="username">Usuário</p>
                    <p class="role">Administrador</p>
                </div>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <span>DASHBOARD</span> 
                <span class="date-now" id="data-atual"></span> 
            </header>

            <section class="cards-grid">
                <div class="card blue"><i class="fas fa-box"></i><div class="card-info"><h3>1.250</h3><p>ESTOQUE ATUAL.</p></div></div>
                <div class="card orange"><i class="fas fa-clock"></i><div class="card-info"><h3>12h</h3><p>ÚLTIMA ATUALIZAÇÃO.</p></div></div>
            </section>

            <section class="stats-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                <div class="chart-placeholder" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <h4 style="margin-bottom: 20px;"><i class="fas fa-chart-line"></i> Produção Semanal</h4>
                    <div style="margin: 15px 0;">
                        <p>Onda B: 85%</p>
                        <div style="background:#eee; height:10px; border-radius:5px;"><div style="width:85%; background:#4a90e2; height:100%; border-radius:5px;"></div></div>
                        <P>Onda C: 50%</P>
                        <div style="background:#eee; height:10px; border-radius:5px;"><div style="width:50%; background:#4a90e2; height:100%; border-radius:5px;"></div></div>
                    </div>
                </div>
                <div class="chart-placeholder" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <h4 style="margin-bottom: 20px;"><i class="fas fa-bell"></i> Avisos Rápidos</h4>
                    <p style="padding: 10px 0; border-bottom: 1px solid #f0f0f0;">• Reposição de Chapa B necessária.</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        // ALGORITMO DA DATA (Igual à foto: azul, negrito e por extenso)
        function formatarData() {
            const elementoData = document.getElementById('data-atual');
            const data = new Date();
            const opcoes = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            
            // "quinta-feira, 23 de abril de 2026"
            let dataFormatada = data.toLocaleDateString('pt-BR', opcoes);
            elementoData.innerText = dataFormatada;
        }

        // Carregamento de dados do Banco
        window.onload = async () => {
            formatarData();
            
            try {
                const resp = await fetch('http://localhost:3000/dados');
                const dados = await resp.json();
                // Aqui você pode preencher os cards com dados reais se quiser
            } catch (erro) {
                console.error("Erro ao buscar dados:", erro);
            }
        };
    </script>
</body>
</html>
