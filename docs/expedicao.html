<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>J&E - Expedição </title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .card-pedido { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #3498db; display: flex; justify-content: space-between; align-items: center; }
        .btn-conferir { background: #f39c12; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    
    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-box-open"></i> J&E Embalagens LTDA
            </div>
            <nav>
                <ul>
                    <li class="menu-item" onclick="window.location.href='index.html'">
                        <i class="fas fa-th-large"></i> Dashboard
                    </li>
                    <li class="menu-item" onclick="window.location.href='chapas.html'">
                        <i class="fas fa-layer-group"></i> Chapas
                    </li>
                    <li class="menu-item" onclick="window.location.href='caixas.html'">
                        <i class="fas fa-boxes"></i> Caixas Prontas
                    </li>
                    <li class="menu-item" onclick="window.location.href='producao.html'">
                        <i class="fas fa-industry"></i> Produção
                    </li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'">
                        <i class="fas fa-user"></i> Perfil
                    </li>
                    <li class="menu-item active" onclick="window.location.href='expedicao.html'">
                        <i class="fas fa-truck"></i> Expedição
                    </li>
                </ul>
            </nav>

            <div class="user-info">
                <div class="avatar">U</div>
                <div>
                    <p class="username">Usuário</p>
                    <p class="role">Administrador</p>
                </div>
            </div>
        </aside>
    
    <div class="main-container">
        <main class="content">
            <header class="top-bar"><span>CONFERÊNCIA DE EXPEDIÇÃO - PALOMA</span></header>
            
            <div id="lista-pedidos">
                </div>
        </main>
    </div>

    <script>

// Botão Sair (Coloque isso na função do seu botão de Sair)
function logout() {
    localStorage.clear();
    window.location.href = 'login.html';
}

        async function carregarPedidos() {
            const resp = await fetch('http://localhost:3000/pedidos-pendentes');
            const pedidos = await resp.json();
            const container = document.getElementById('lista-pedidos');
            
            container.innerHTML = pedidos.map(p => `
                <div class="card-pedido">
                    <div>
                        <strong>Cliente: ${p.cliente}</strong><br>
                        <span>Onda: ${p.tipo_onda} | Medida: ${p.medida}</span><br>
                        <span>Programado: ${p.qtd_programada} un</span>
                    </div>
                    <button class="btn-conferir" onclick="confirmarChegada(${p.id}, ${p.qtd_programada})">
                        Conferir Quantidade
                    </button>
                </div>
            `).join('');
        }

        async function confirmarChegada(id, qtdOriginal) {
            const { value: qtdReal } = await Swal.fire({
                title: 'Conferência de Carga',
                input: 'number',
                inputLabel: `Quantidade real produzida (Programado: ${qtdOriginal})`,
                inputValue: qtdOriginal,
                showCancelButton: true
            });

            if (qtdReal) {
                await fetch(`http://localhost:3000/conferir-pedido`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, qtdReal })
                });
                Swal.fire('Sucesso!', 'Pedido enviado ao estoque e notificado.', 'success');
                carregarPedidos();
            }
        }
        carregarPedidos();

// Função para Sair do Sistema
function logout() {
    localStorage.clear();
    window.location.href = 'login.html';
}
    </script>
</body>
</html>
