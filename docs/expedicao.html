<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script>
    const temaSalvo = localStorage.getItem('tema') || 'claro';
    document.documentElement.setAttribute('data-theme', temaSalvo);
    </script>

    <meta charset="UTF-8">
    <title>J&E - Expedição</title>
    
    <script>
        if (localStorage.getItem('logado') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .main-container { height: 100vh; display: flex; overflow: hidden; }
        .content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-bar { flex-shrink: 0; }
        .expedicao-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; flex-grow: 1; height: calc(100vh - 80px); box-sizing: border-box; overflow: hidden; }
        .coluna-expedicao { background: rgba(0, 0, 0, 0.03); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; height: 100%; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
        .titulo-secao { font-size: 1.1em; color: #e67e22; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .scroll-lista { flex-grow: 1; overflow-y: auto; padding-right: 8px; }
        .scroll-lista::-webkit-scrollbar { width: 6px; }
        .scroll-lista::-webkit-scrollbar-track { background: transparent; }
        .scroll-lista::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .scroll-lista::-webkit-scrollbar-thumb:hover { background: #ff9027; }
        .card-pedido, .card-finalizado { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #3498db; transition: 0.2s; }
        .card-finalizado { border-left: 5px solid #27ae60; background: #f8fff9; }
        .info-txt { font-size: 0.9em; color: #555; line-height: 1.4; }
        .info-txt strong { color: #2c3e50; font-size: 1.1em; }
        .btn-conferir { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-conferir:hover { background: #2ecc71; transform: scale(1.05); }
        .swal-label { display: block; margin-top: 15px; font-weight: bold; text-align: left; }
    </style>
</head>
<body>
    
    <div class="main-container">
        <aside class="sidebar">
            <div class="logo"><i class="fas fa-box-open"></i> J&E Embalagens LTDA</div>
            <nav>
                <ul>
                    <li class="menu-item" onclick="window.location.href='index.html'"><i class="fas fa-th-large"></i> Dashboard</li>
                    <li class="menu-item" onclick="window.location.href='chapas.html'"><i class="fas fa-layer-group"></i> Chapas</li>
                    <li class="menu-item" onclick="window.location.href='caixas.html'"><i class="fas fa-boxes"></i> Caixas Prontas</li>
                    <li class="menu-item" onclick="window.location.href='producao.html'"><i class="fas fa-industry"></i> Produção</li>
                    <li class="menu-item" onclick="window.location.href='movimentacoes.html'"><i class="fas fa-exchange-alt"></i> Movimentações</li>
                    <li class="menu-item" onclick="window.location.href='perfil.html'"><i class="fas fa-user"></i> Perfil</li>
                    <li class="menu-item active" onclick="window.location.href='expedicao.html'"><i class="fas fa-clipboard-list"></i> Expedição</li>
                    <li class="menu-item" onclick="window.location.href='entrada_chapas.html'"><i class="fas fa-truck-loading"></i> Entrada de Chapas</li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 0 20px;">
                <div class="user-info">
                    <div class="avatar">U</div>
                    <div>
                        <p class="username">Usuário</p>
                        <p class="role">Administrador</p>
                    </div>
                </div>
                <div class="logout-container">
                    <button onclick="fazerLogout()" class="btn-logout-red"><i class="fas fa-sign-out-alt"></i> SAIR DO SISTEMA</button>
                </div>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <strong><span>CONFERÊNCIA DE EXPEDIÇÃO</span></strong>
                <strong><span class="date-now" id="data-atual"></span></strong>
            </header>
            
            <div class="expedicao-grid">
                <div class="coluna-expedicao">
                    <h2 class="titulo-secao"><i class="fas fa-clock"></i> Aguardando Conferência</h2>
                    <div id="lista-pedidos" class="scroll-lista"></div>
                </div>
                <div class="coluna-expedicao">
                    <h2 class="titulo-secao" style="color: #27ae60;"><i class="fas fa-check-circle"></i> Finalizados Hoje</h2>
                    <div id="lista-finalizados" class="scroll-lista"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_URL = '/api';
        const usuarioLogado = localStorage.getItem('usuario') || 'Sistema';

        async function carregarTudo() {
            try {
                const res = await fetch(`${API_URL}/pedidos-recentes`);
                const todosOsPedidos = await res.json();
                const containerPendentes = document.getElementById('lista-pedidos');
                const containerFinalizados = document.getElementById('lista-finalizados');

                const pendentes = todosOsPedidos.filter(p => p.status === 'PENDENTE');
                const finalizados = todosOsPedidos.filter(p => p.status === 'CONCLUÍDO');

                containerPendentes.innerHTML = pendentes.length === 0 
                    ? '<p style="color:#888; padding:20px;">Nenhuma carga aguardando.</p>'
                    : pendentes.map(p => `
                        <div class="card-pedido">
                            <div class="info-txt">
                                <strong>${p.cliente}</strong><br>
                                Ref: ${p.referencia || 'S/ REF'} | Onda: ${p.tipo_onda}<br>
                                <span>Prog: <b>${p.qtd_programada}</b> un</span>
                            </div>
                            <button class="btn-conferir" onclick="confirmarChegada(${p.id}, ${p.qtd_programada})">Conferir</button>
                        </div>
                    `).join('');

                containerFinalizados.innerHTML = finalizados.length === 0
                    ? '<p style="color:#888; padding:20px;">Nenhum concluído hoje.</p>'
                    : finalizados.map(f => `
                        <div class="card-finalizado">
                            <div class="info-txt">
                                <strong>${f.cliente}</strong><br>
                                Ref: ${f.referencia || 'S/ REF'}<br>
                                <span>Conf: <b>${f.qtd_conferida || f.qtd_programada}</b> un</span><br>
                                <small style="color:#27ae60"><i class="fas fa-user-check"></i> Resp: ${f.responsavel || 'Sistema'}</small>
                            </div>
                        </div>
                    `).join('');
            } catch (err) { console.error("Erro ao carregar:", err); }
        }

        async function confirmarChegada(id, qtdOriginal) {
            const { value: formValues } = await Swal.fire({
                title: 'Conferência de Carga',
                html: `<label class="swal-label">Quantidade Real Produzida</label>
                       <input id="swal-qtd" class="swal2-input" type="number" min="1" value="${qtdOriginal}">`,
                showCancelButton: true,
                confirmButtonText: 'Finalizar e Enviar',
                preConfirm: () => {
                    return { qtd_conferida: parseInt(document.getElementById('swal-qtd').value) }
                }
            });

            if (formValues) {
                try {
                    const response = await fetch(`${API_URL}/conferir-pedido`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            id: id, 
                            qtd_conferida: formValues.qtd_conferida,
                            responsavel: usuarioLogado // <--- Automático
                        })
                    });
                    const resultado = await response.json();
                    if (resultado.success) {
                        Swal.fire('Sucesso!', 'Pedido conferido.', 'success');
                        carregarTudo();
                    } else { Swal.fire('Erro', resultado.message, 'error'); }
                } catch (err) { Swal.fire('Erro', 'Falha na conexão.', 'error'); }
            }
        }

        function fazerLogout() {
            Swal.fire({
                title: 'Deseja sair?',
                text: "Sua sessão será encerrada.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, sair!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear(); 
                    window.location.href = 'login.html'; 
                }
            });
        }

        window.onload = () => {
            carregarTudo();
            const elData = document.getElementById('data-atual');
            if (elData) elData.innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            
           const user = localStorage.getItem('usuario');
            const cargo = localStorage.getItem('cargo');
            if (user) {
                document.querySelector('.username').innerText = user;
                document.querySelector('.avatar').innerText = user.charAt(0).toUpperCase();
            }
            if (cargo) document.querySelector('.role').innerText = cargo;
        };
    </script>
</body>
</html>
