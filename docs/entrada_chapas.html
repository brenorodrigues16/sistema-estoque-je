            <form id="form-entrada" class="tabela-container" style="margin-bottom: 20px;">
    <h2>Registrar Entrada de Chapas</h2>
    <br>
    
    <div class="form-row">
        <input type="text" id="onda" placeholder="Onda:" required>
        <input type="number" id="comprimento" placeholder="Comprimento (mm):" required>
        <input type="number" id="largura" placeholder="Largura (mm):" required>
        <input type="text" id="fornecedor" placeholder="Fornecedor:" required>
        <input type="number" id="quantidade" placeholder="Quantidade:" required>
    </div>

    <button type="submit" class="btn-verde">
        <i class="fas fa-plus"></i> Registrar Entrada de chapa
    </button>
</form>

    <div class="card-header">
        <div class="tabela-container">
    <h3>Entradas do Dia</h3>
    <table id="tabela-entradas">
        <thead>
            <tr>
                <th>Onda</th>
                <th>Comprimento</th>
                <th>Largura</th>
                <th>Fornecedor</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

      </main>

<script>

async function carregarEntradas() {
    const resp = await fetch('http://localhost:3000/api/entrada-chapas-hoje');

if (localStorage.getItem('cargo') !== 'Operador') {
    document.getElementById('form-entrada').style.display = 'none';
}

    const entradas = await resp.json();
    const tbody = document.querySelector('#tabela-entradas tbody');
    tbody.innerHTML = '';
    
    entradas.forEach(item => {
        tbody.innerHTML += `<tr>
            <td>${item.onda}</td>
            <td>${item.comprimento}</td>
            <td>${item.largura}</td>
            <td>${item.fornecedor}</td>
            <td>${item.quantidade}</td>
        </tr>`;
    });
}

document.getElementById('form-entrada').addEventListener('submit', async (e) => {
    e.preventDefault();
    const dados = {
        onda: document.getElementById('onda').value,
        comprimento: document.getElementById('comprimento').value,
        largura: document.getElementById('largura').value,
        fornecedor: document.getElementById('fornecedor').value,
        quantidade: document.getElementById('quantidade').value,
        usuario: localStorage.getItem('usuario')
    };

    const resp = await fetch('http://localhost:3000/api/registrar-entrada', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(dados)
    });

    if ((await resp.json()).success) {
        Swal.fire('Sucesso!', 'Chapas adicionadas ao estoque.', 'success');
        document.getElementById('form-entrada').reset();
        carregarEntradas();
    }
});




             function fazerLogout() {
            Swal.fire({
                title: 'Deseja sair?',
                text: "Sua sessão será encerrada.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, sair!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.clear(); 
                    window.location.href = 'login.html'; 
                }
            });
        }

         window.onload = () => {

            carregarEntradas();

           document.getElementById('data-atual').innerText = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            
           const user = localStorage.getItem('usuario');

            const cargo = localStorage.getItem('cargo');

            if (user) {
                document.querySelector('.username').innerText = user;
                document.querySelector('.avatar').innerText = user.charAt(0).toUpperCase();
            }
            if (cargo) document.querySelector('.role').innerText = cargo;
        };
        </script>
