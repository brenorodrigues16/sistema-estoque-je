<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produção - J&E Embalagens</title>
    <link rel="stylesheet" href="../dashboard.css"> <!-- O '../' busca o CSS que está fora da pasta -->
</head>
<body>
    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">J&E Embalagens</div>
            <nav>
                <a href="index.html">Painel Principal</a>
                <a href="chapas.html">Estoque de Chapas</a>
                <a href="caixas.html">Estoque de Caixas</a>
                <a href="producao.html" class="active">Lançar Produção</a>
            </nav>
        </aside>

        <main class="content">
            <header><h1>Registrar Produção Diária</h1></header>
            <section class="form-container">
                <div class="form-card">
                    <form id="formProducao">
                        <div class="input-group">
                            <label for="tipoChapa">Tipo de Chapa</label>
                            <input type="text" id="tipoChapa" required>
                        </div>
                        <div class="input-group">
                            <label for="medidaCaixa">Medida da Caixa</label>
                            <input type="text" id="medidaCaixa" required>
                        </div>
                        <div class="input-group">
                            <label for="quantidade">Quantidade</label>
                            <input type="number" id="quantidade" required>
                        </div>
                        <button type="submit" class="btn-primary">Finalizar Produção</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('formProducao').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                tipoChapa: document.getElementById('tipoChapa').value,
                medidaCaixa: document.getElementById('medidaCaixa').value,
                quantidade: parseInt(document.getElementById('quantidade').value)
            };

            try {
                // Link do seu Render atualizado
                const response = await fetch('https://sistema-estoque-je.onrender.com/produzir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alert('Sucesso! Estoque atualizado no Render.');
                    e.target.reset();
                }
            } catch (error) {
                alert('Erro na conexão com o servidor do Render.');
            }
        });
    </script>
</body>
</html>
