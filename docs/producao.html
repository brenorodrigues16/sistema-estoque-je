<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produção - J&E Embalagens</title>
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <aside class="sidebar">
            <div class="logo">J&E Embalagens</div>
            <nav>
                <a href="index.html">Painel Principal</a>
                <a href="chapas.html">Estoque de Chapas</a>
                <a href="caixas.html">Estoque de Caixas</a>
                <a href="producao.html" class="active">Lançar Produção</a>
            </nav>
        </aside>

        <main class="content">
            <header>
                <h1>Registrar Produção Diária</h1>
            </header>

            <section class="form-container">
                <div class="form-card">
                    <form id="formProducao">
                        <div class="input-group">
                            <label for="tipoChapa">Tipo de Chapa Utilizada</label>
                            <input type="text" id="tipoChapa" placeholder="Ex: Onda B" required>
                        </div>
                        <div class="input-group">
                            <label for="medidaCaixa">Medida da Caixa Produzida</label>
                            <input type="text" id="medidaCaixa" placeholder="Ex: 20x15x10" required>
                        </div>
                        <div class="input-group">
                            <label for="quantidade">Quantidade Produzida</label>
                            <input type="number" id="quantidade" placeholder="0" required>
                        </div>
                        <button type="submit" class="btn-primary">Finalizar Produção</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('formProducao').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                tipoChapa: document.getElementById('tipoChapa').value,
                medidaCaixa: document.getElementById('medidaCaixa').value,
                quantidade: parseInt(document.getElementById('quantidade').value)
            };

            try {
                // ATUALIZADO: Usando o link do Render para registrar a produção
                const response = await fetch('https://sistema-estoque-je.onrender.com/produzir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alert('Produção registrada! O estoque de chapas foi atualizado.');
                    e.target.reset();
                } else {
                    alert('Erro ao registrar produção. Verifique os dados.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Servidor fora do ar ou erro de conexão.');
            }
        });
    </script>
</body>
</html>
